<!DOCTYPE html>
<html>
<head>
  <title>AI Story Maker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <h1>🎬 AI Story Maker</h1>

    <p class="subtitle">
      Apni story ka idea likho aur animated story banao
    </p>

    <textarea
      id="storyPrompt"
      placeholder="Example: Ek chhota bachcha jungle mein jaata hai aur ek pyare kutte se milta hai..."
    ></textarea>

    <div class="options">

      <label>
        🎨 Style
        <select id="style">
          <option>Cartoon</option>
          <option>3D Animation</option>
          <option>Storybook</option>
          <option>Anime</option>
        </select>
      </label>

      <label>
        🗣️ Voice
        <select id="voice">
          <option>Hindi</option>
          <option>English</option>
        </select>
      </label>

      <label>
        ⏱️ Duration
        <select id="duration">
          <option>30 Seconds</option>
          <option>1 Minute</option>
          <option>2 Minutes</option>
        </select>
      </label>

    </div>

    <button id="connectBtn">
  🔗 Connect AI
</button>

<button id="generateBtn">
  🎬 Generate AI Video
      </button>
<div id="result">
  <p>🎬 Tumhari AI video yahan banegi...</p>

  <video
    id="videoPlayer"
    controls
    style="width:100%; margin-top:20px; border-radius:15px; display:none;"
  ></video>
        </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
